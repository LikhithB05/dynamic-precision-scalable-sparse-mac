<svg xmlns="http://www.w3.org/2000/svg" width="980" height="279" viewBox="0 0 980 279" role="img"><title>From MNIST to a signed RTL sum</title><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect x="0" y="0" width="980" height="279" rx="7" fill="#eff6f6"/><text x="32" y="40" fill="#173448" font-size="26" font-weight="700">From MNIST to a signed RTL sum</text><text x="32" y="68" fill="#173448" font-size="14" font-weight="400">Software trains both dense layers. Hardware validation uses one exported input/weight sequence.</text><rect x="32" y="117" width="207" height="95" rx="7" fill="#365f8a"/><text x="44" y="145" fill="white" font-size="15" font-weight="700">Image preparation</text><text x="44" y="170" fill="white" font-size="13" font-weight="400">28 × 28 grayscale; ToTensor</text><text x="44" y="192" fill="white" font-size="13" font-weight="400">Flatten to 784 pixel values</text><path d="M240 165 L261 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M268 165 l-8 -5 v10 z" fill="#647787"/><rect x="270" y="117" width="207" height="95" rx="7" fill="#365f8a"/><text x="282" y="145" fill="white" font-size="15" font-weight="700">SimpleDNN</text><text x="282" y="170" fill="white" font-size="13" font-weight="400">Linear 784 → 128 · ReLU</text><text x="282" y="192" fill="white" font-size="13" font-weight="400">Linear 128 → 10 logits</text><path d="M478 165 L499 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M506 165 l-8 -5 v10 z" fill="#647787"/><rect x="508" y="117" width="207" height="95" rx="7" fill="#007878"/><text x="520" y="145" fill="white" font-size="15" font-weight="700">Export</text><text x="520" y="170" fill="white" font-size="13" font-weight="400">Image and fc1 weight row 0</text><text x="520" y="192" fill="white" font-size="13" font-weight="400">Scale, truncate, write hex</text><path d="M716 165 L737 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M744 165 l-8 -5 v10 z" fill="#647787"/><rect x="746" y="117" width="207" height="95" rx="7" fill="#173448"/><text x="758" y="145" fill="white" font-size="15" font-weight="700">MAC verification</text><text x="758" y="170" fill="white" font-size="13" font-weight="400">$readmemh; 784 indexed pairs</text><text x="758" y="192" fill="white" font-size="13" font-weight="400">Signed Python sum vs RTL</text><text x="32" y="252" fill="#173448" font-size="14" font-weight="400">Both operands share their index-region multiplier. Hardware modes follow signed range, independently of those regions.</text></svg>