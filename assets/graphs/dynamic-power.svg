<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" font-family="Arial,sans-serif"><title>Dynamic power for four routed OOC MAC designs</title><rect width="1000" height="450" fill="#f5f8fa"/><text x="28" y="47" font-size="29" font-weight="700" fill="#163448">Routed out-of-context dynamic power estimates</text><text x="28" y="82" font-size="17" font-weight="400" fill="#163448">Artix-7 xc7a200tfbg676-2  ·  12 MHz constraint  ·  vectorless  ·  milliwatts</text><text x="28" y="144" font-size="19" font-weight="400" fill="#163448">Conventional shift-and-add</text><rect x="300" y="122" width="150" height="30" fill="#57748d"/><text x="464" y="144" font-size="18" font-weight="400" fill="#163448">3 mW</text><text x="28" y="204" font-size="19" font-weight="400" fill="#163448">Proposed Design I</text><rect x="300" y="182" width="450" height="30" fill="#57748d"/><text x="764" y="204" font-size="18" font-weight="400" fill="#163448">9 mW</text><text x="28" y="264" font-size="19" font-weight="400" fill="#163448">Clean sparse wrapper</text><rect x="300" y="242" width="500" height="30" fill="#57748d"/><text x="814" y="264" font-size="18" font-weight="400" fill="#163448">10 mW</text><text x="28" y="324" font-size="19" font-weight="400" fill="#163448">Proposed Design II</text><rect x="300" y="302" width="350" height="30" fill="#087a78"/><text x="664" y="324" font-size="18" font-weight="400" fill="#163448">7 mW</text><text x="28" y="390" font-size="16" font-weight="400" fill="#163448">Source: archived Vivado power reports. Output interfaces and numerical behavior vary by design.</text><text x="28" y="418" font-size="16" font-weight="400" fill="#163448">The separate 69 mW conventional top-level report includes 63 mW of I/O pad activity.</text></svg>