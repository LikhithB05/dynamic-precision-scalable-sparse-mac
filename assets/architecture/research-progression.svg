<svg xmlns="http://www.w3.org/2000/svg" width="980" height="279" viewBox="0 0 980 279" role="img"><title>Two original MAC designs</title><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect x="0" y="0" width="980" height="279" rx="7" fill="#eff6f6"/><text x="32" y="40" fill="#173448" font-size="26" font-weight="700">Two original MAC designs</text><text x="32" y="68" fill="#173448" font-size="14" font-weight="400">Research progression from fixed precision to selective arithmetic activity</text><rect x="32" y="117" width="207" height="95" rx="7" fill="#647787"/><text x="44" y="145" fill="white" font-size="15" font-weight="700">Conventional references</text><text x="44" y="170" fill="white" font-size="13" font-weight="400">Shift-and-add</text><text x="44" y="192" fill="white" font-size="13" font-weight="400">Baugh–Wooley and carry-select</text><path d="M240 165 L261 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M268 165 l-8 -5 v10 z" fill="#647787"/><rect x="270" y="117" width="207" height="95" rx="7" fill="#365f8a"/><text x="282" y="145" fill="white" font-size="15" font-weight="700">Proposed Design I</text><text x="282" y="170" fill="white" font-size="13" font-weight="400">Automatic signed precision</text><text x="282" y="192" fill="white" font-size="13" font-weight="400">Shared Booth–Wallace datapath</text><path d="M478 165 L499 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M506 165 l-8 -5 v10 z" fill="#647787"/><rect x="508" y="117" width="207" height="95" rx="7" fill="#007878"/><text x="520" y="145" fill="white" font-size="15" font-weight="700">Proposed Design II</text><text x="520" y="170" fill="white" font-size="13" font-weight="400">Zero-aware extension</text><text x="520" y="192" fill="white" font-size="13" font-weight="400">Precision-qualified controls</text><path d="M716 165 L737 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M744 165 l-8 -5 v10 z" fill="#647787"/><rect x="746" y="117" width="207" height="95" rx="7" fill="#173448"/><text x="758" y="145" fill="white" font-size="15" font-weight="700">Evaluation</text><text x="758" y="170" fill="white" font-size="13" font-weight="400">MNIST-derived operands</text><text x="758" y="192" fill="white" font-size="13" font-weight="400">RTL checks and FPGA reports</text><text x="32" y="252" fill="#173448" font-size="14" font-weight="400">Shared motivation: use the arithmetic needed by the current operand pair.</text></svg>