3448">On a zero pair, the encoder output masks suppress all sixteen digits.</text><text x="28" y="382" font-size="24" font-weight="700" fill="#163448">Wallace tree  /  rows after each compressor stage</text><text x="42" y="433" font-size="26" font-weight="700" fill="#163448">16</text><rect x="42" y="456" width="45" height="96" fill="#197e83"/><text x="176" y="433" font-size="26" font-weight="700" fill="#163448">11</text><rect x="176" y="456" width="45" height="66" fill="#197e83"/><text x="310" y="433" font-size="26" font-weight="700" fill="#163448">8</text><rect x="310" y="456" width="45" height="48" fill="#197e83"/><text x="444" y="433" font-size="26" font-weight="700" fill="#163448">6</text><rect x="444" y="456" width="45" height="36" fill="#197e83"/><text x="578" y="433" font-size="26" font-weight="700" fill="#163448">4</text><rect x="578" y="456" width="45" height="24" fill="#197e83"/><text x="712" y="433" font-size="26" font-weight="700" fill="#163448">3</text><rect x="712" y="456" width="45" height="18" fill="#197e83"/><text x="846" y="433" font-size="26" font-weight="700" fill="#163448">2</text><rect x="846" y="456" width="45" height="12" fill="#197e83"/><text x="28" y="596" font-size="17" font-weight="400" fill="#163448">Each 3:2 compressor returns XOR and majority vectors. The majority vector shifts left by one.</text></svg>