<svg xmlns="http://www.w3.org/2000/svg" width="980" height="279" viewBox="0 0 980 279" role="img"><title>Shared arithmetic, selective activity</title><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect x="0" y="0" width="980" height="279" rx="7" fill="#eff6f6"/><text x="32" y="40" fill="#173448" font-size="26" font-weight="700">Shared arithmetic, selective activity</text><text x="32" y="68" fill="#173448" font-size="14" font-weight="400">Both designs use signed width detection, radix-4 Booth digits and Wallace reduction.</text><rect x="32" y="117" width="207" height="95" rx="7" fill="#365f8a"/><text x="44" y="145" fill="white" font-size="15" font-weight="700">Design I</text><text x="44" y="170" fill="white" font-size="13" font-weight="400">Structural final merge</text><text x="44" y="192" fill="white" font-size="13" font-weight="400">Update on each clock edge</text><path d="M240 165 L261 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M268 165 l-8 -5 v10 z" fill="#647787"/><rect x="270" y="117" width="207" height="95" rx="7" fill="#647787"/><text x="282" y="145" fill="white" font-size="15" font-weight="700">Shared datapath</text><text x="282" y="170" fill="white" font-size="13" font-weight="400">Signed width and formatter</text><text x="282" y="192" fill="white" font-size="13" font-weight="400">Booth → carry-save tree</text><path d="M478 165 L499 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M506 165 l-8 -5 v10 z" fill="#647787"/><rect x="508" y="117" width="207" height="95" rx="7" fill="#007878"/><text x="520" y="145" fill="white" font-size="15" font-weight="700">Design II controls</text><text x="520" y="170" fill="white" font-size="13" font-weight="400">Either-zero test + mode</text><text x="520" y="192" fill="white" font-size="13" font-weight="400">Mask encoder outputs</text><path d="M716 165 L737 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M744 165 l-8 -5 v10 z" fill="#647787"/><rect x="746" y="117" width="207" height="95" rx="7" fill="#007878"/><text x="758" y="145" fill="white" font-size="15" font-weight="700">Design II output</text><text x="758" y="170" fill="white" font-size="13" font-weight="400">Native carry merge</text><text x="758" y="192" fill="white" font-size="13" font-weight="400">Sign-extended, enabled sum</text><text x="32" y="252" fill="#173448" font-size="14" font-weight="400">The original clock drives the register. Zero detection controls partial products and the accumulator update.</text></svg>