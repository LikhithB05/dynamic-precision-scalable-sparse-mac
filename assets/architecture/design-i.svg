<svg xmlns="http://www.w3.org/2000/svg" width="980" height="279" viewBox="0 0 980 279" role="img"><title>Proposed Design I · Dynamic Precision-Scalable MAC</title><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect x="0" y="0" width="980" height="279" rx="7" fill="#eff6f6"/><text x="32" y="40" fill="#173448" font-size="26" font-weight="700">Proposed Design I · Dynamic Precision-Scalable MAC</text><text x="32" y="68" fill="#173448" font-size="14" font-weight="400">Both external operands are signed 32-bit words</text><rect x="32" y="117" width="207" height="95" rx="7" fill="#365f8a"/><text x="44" y="145" fill="white" font-size="15" font-weight="700">Mode and formatting</text><text x="44" y="170" fill="white" font-size="13" font-weight="400">Signed fit: INT8/16/32</text><text x="44" y="192" fill="white" font-size="13" font-weight="400">Sign-extend the chosen width</text><path d="M240 165 L261 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M268 165 l-8 -5 v10 z" fill="#647787"/><rect x="270" y="117" width="207" height="95" rx="7" fill="#365f8a"/><text x="282" y="145" fill="white" font-size="15" font-weight="700">Booth and Wallace</text><text x="282" y="170" fill="white" font-size="13" font-weight="400">Radix-4 recoding</text><text x="282" y="192" fill="white" font-size="13" font-weight="400">Carry-save compression</text><path d="M478 165 L499 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M506 165 l-8 -5 v10 z" fill="#647787"/><rect x="508" y="117" width="207" height="95" rx="7" fill="#173448"/><text x="520" y="145" fill="white" font-size="15" font-weight="700">Structural merge</text><text x="520" y="170" fill="white" font-size="13" font-weight="400">cla_64bit with 4-bit cells</text><text x="520" y="192" fill="white" font-size="13" font-weight="400">64-bit combinational product</text><path d="M716 165 L737 165" stroke="#647787" stroke-width="2" fill="none"/><path d="M744 165 l-8 -5 v10 z" fill="#647787"/><rect x="746" y="117" width="207" height="95" rx="7" fill="#173448"/><text x="758" y="145" fill="white" font-size="15" font-weight="700">Accumulator and debug</text><text x="758" y="170" fill="white" font-size="13" font-weight="400">65-bit internal state</text><text x="758" y="192" fill="white" font-size="13" font-weight="400">Split low word and upper bit</text><text x="32" y="252" fill="#173448" font-size="14" font-weight="400">The original accumulator extension uses the merge carry. Verification notes document its upper-bit limitation.</text></svg>